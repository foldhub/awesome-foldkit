# Awesome Foldkit data. The README is generated from this file.
# Edit this file, then run `npm run build` (or let the GitHub Action do it).
#
# [[section]] fields:
#   id, title, intro, pill (file in assets/pills without .svg)
#   level        2 (default) or 3 for a subsection
#   heading_only true for a group heading with no entries
#   sort         "stars" (default) or "manual" (keep file order)
#
# [[project]] fields:
#   section      a [[section]] id (required)
#   repo         "owner/name" on GitHub (optional if npm or url is set)
#   npm          npm package names (optional; the first one gets a badge)
#   url          main link when it is not the GitHub repo (optional)
#   docs         documentation link (optional)
#   name         display name (optional; default: repo, then first npm package)
#   icon         repo, npm, web, docs, chat, article, compare (optional)
#   description  one sentence, says what it does, ends with a period (required)
#
# [[ignore]] lists repos and packages that match "foldkit" but are not about
# the Foldkit framework, so the discovery job does not report them again.

[[section]]
id = "start"
title = "Start here"
pill = "start"
sort = "manual"
intro = "Foldkit docs and resources."

[[section]]
id = "compare"
title = "Compare and migrate"
pill = "compare"
sort = "manual"
intro = "Side-by-side builds and migration guides."

[[section]]
id = "core"
title = "Core packages"
pill = "core"
sort = "manual"
intro = "Published from the [foldkit/foldkit](https://github.com/foldkit/foldkit) monorepo. All versions move together."

[[section]]
id = "examples"
title = "Examples by the Foldkit team"
pill = "examples"
intro = "Apps and examples from the Foldkit maintainers."

[[section]]
id = "ecosystem"
title = "Ecosystem"
pill = "stack"
heading_only = true
intro = "Community libraries and tools. Each subsection is sorted by GitHub stars."

[[section]]
id = "fullstack"
title = "Full stack and deployment"
level = 3
intro = "Backends, hosting, and starters around a Foldkit frontend."

[[section]]
id = "ui"
title = "UI kits and styling"
level = 3
intro = "Components, styling systems, and icons. Several kits follow the shadcn/ui copy-in model, so check this list before you start a new one."

[[section]]
id = "ai"
title = "AI and agents"
level = 3
intro = "Tools that give coding agents or in-app agents access to a Foldkit app."

[[section]]
id = "interop"
title = "Interop and tooling"
level = 3
intro = "Bridges to React, Astro, and Storybook, plus developer tools."

[[section]]
id = "apps"
title = "Apps built with Foldkit"
pill = "apps"
intro = "Open source applications you can read to learn real patterns."

[[section]]
id = "community"
title = "Community"
pill = "community"
sort = "manual"
intro = "Places to ask questions and follow releases."

