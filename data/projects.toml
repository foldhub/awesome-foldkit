# Awesome Foldkit data. The README is generated from this file.
# Edit this file, then run `npm run build` (or let the GitHub Action do it).
#
# [[project]] fields:
#   section      one of the [[section]] ids below (required)
#   repo         "owner/name" on GitHub (optional if npm or url is set)
#   npm          npm package names (optional)
#   url          main link when it is not the GitHub repo (optional)
#   name         display name (optional, default: repo name or first npm package)
#   description  one sentence, says what it does, ends with a period (required)
#
# [[ignore]] lists repos and packages that match "foldkit" but are not about
# the Foldkit framework, so the discovery job does not report them again.

[[section]]
id = "official"
title = "Official"
intro = "Packages and repositories from the Foldkit maintainers."

[[section]]
id = "fullstack"
title = "Full stack and deployment"
intro = "Backends, hosting, and starters around a Foldkit frontend."

[[section]]
id = "ui"
title = "UI kits and styling"
intro = "Components, styling systems, and icons. Several kits follow the shadcn/ui copy-in model."

[[section]]
id = "ai"
title = "AI and agents"
intro = "Tools that give coding agents or in-app agents access to a Foldkit app."

[[section]]
id = "interop"
title = "Interop and tooling"
intro = "Bridges to React, Astro, and Storybook, plus developer tools."

[[section]]
id = "apps"
title = "Apps built with Foldkit"
intro = "Open source applications you can read to learn real patterns."

[[section]]
id = "learning"
title = "Learning and community"
intro = "Docs, examples, and places to ask questions."

# OFFICIAL

[[project]]
section = "official"
repo = "foldkit/foldkit"
npm = ["foldkit"]
url = "https://foldkit.dev"
name = "Foldkit"
description = "TypeScript frontend framework on Effect with the Elm Architecture: one Model, a Message union, a pure update, and Commands for side effects."

[[project]]
section = "official"
npm = ["@foldkit/ui"]
url = "https://foldkit.dev/ui/overview"
description = "Headless, accessible UI components (Dialog, Menu, Listbox, Combobox, Popover, Calendar, and more) built as Submodels."

[[project]]
section = "official"
npm = ["@foldkit/vite-plugin"]
description = "Vite plugin with state-preserving live reload, view identity, and server rendering in dev."

[[project]]
section = "official"
npm = ["@foldkit/devtools"]
description = "In-browser DevTools overlay with Message history and time travel."

[[project]]
section = "official"
npm = ["@foldkit/devtools-mcp"]
url = "https://foldkit.dev/ai/mcp"
description = "MCP server that lets coding agents read the Model, dispatch Messages, and time travel in a running app."

[[project]]
section = "official"
npm = ["@foldkit/oxlint-plugin"]
description = "Oxlint rules for Foldkit conventions."

[[project]]
section = "official"
npm = ["@foldkit/markdown"]
description = "Write Markdown files and get Foldkit views with live islands."

[[project]]
section = "official"
npm = ["create-foldkit-app"]
description = "Scaffold a new Foldkit app."

[[project]]
section = "official"
repo = "foldkit/coverchart"
description = "App for writing chord charts with lyrics."

[[project]]
section = "official"
repo = "foldkit/patch-match"
description = "Game: match the patch."

